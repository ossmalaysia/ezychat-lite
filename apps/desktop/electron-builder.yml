# electron-builder config for EzyChat Lite (run from apps/desktop: `npm run dist`).
# Prerequisites (done by the dist script): web build (apps/web/dist), server bundle
# (dist/server/server.cjs via scripts/bundle-server.mjs), tsc (dist/main.js),
# cloudflared (scripts/fetch-cloudflared.mjs) and WinSW (scripts/fetch-winsw.mjs).
appId: org.ossmalaysia.wateaminbox
productName: EzyChat Lite
copyright: Copyright © OSS Malaysia and contributors
artifactName: EzyChat-Lite-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - package.json
  - dist/**/*
  - '!dist/**/*.map'
  - src/renderer/**/*
  # better-sqlite3 ships prebuilt binaries; its C sources are only needed to compile from source
  - '!**/node_modules/better-sqlite3/{deps,src}/**'
  - '!**/node_modules/better-sqlite3/binding.gyp'

asar: true
asarUnpack:
  - '**/*.node'
  # whole native packages (JS loaders + binaries) so the server also runs from
  # app.asar.unpacked/dist/server/server.cjs with plain module resolution
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/@node-rs/**'
  - '**/server/**'
  # server launcher (forked / run by the OS service, like server.cjs)
  - 'dist/server-host.cjs'
  # read by the server for its version (<server dir>/../package.json)
  - 'dist/package.json'

# Native modules: better-sqlite3 (v12+) and @node-rs/argon2 are Node-API addons with prebuilt
# binaries, so the same build loads in Node (tests) and in Electron (utilityProcess /
# ELECTRON_RUN_AS_NODE=1). No Electron rebuild needed; rebuilding would also touch the shared
# workspace node_modules used by the server tests.
npmRebuild: false

extraResources:
  - from: build/icon.png
    to: app-icon.png
  - from: ../web/dist
    to: web
  # tray icons (tray.png on Windows/Linux, trayTemplate.png on macOS); read via process.resourcesPath
  - from: build/tray
    to: tray
    filter: ['*.png']

win:
  icon: build/icon.ico
  # Keep the binary path referenced by existing Windows service configurations.
  executableName: EzyChat Lite
  target:
    - target: nsis
      arch: [x64]
  extraResources:
    - from: ../../resources/cloudflared/win32-x64
      to: cloudflared
      filter: ['cloudflared.exe']
    - from: ../../resources/winsw
      to: winsw
      filter: ['WinSW-x64.exe']

nsis:
  oneClick: false
  # per-machine install so the LocalSystem service can read the app files
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EzyChat Lite
  deleteAppDataOnUninstall: false

mac:
  icon: build/icon.png
  category: public.app-category.business
  # unsigned v1
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
  target:
    - target: dmg
      arch: [x64, arm64]
  extraResources:
    - from: ../../resources/cloudflared/darwin-${arch}
      to: cloudflared
      filter: ['cloudflared']

dmg:
  title: EzyChat Lite ${version}

linux:
  icon: build/icon.png
  category: Network
  target: [AppImage]
  extraResources:
    - from: ../../resources/cloudflared/linux-${arch}
      to: cloudflared
      filter: ['cloudflared']
