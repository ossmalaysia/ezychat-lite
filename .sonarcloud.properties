# Analyze the application, test tooling, configuration and workflows.
# Frozen cumulative HTML references under docs copy application source intentionally.
# Automatic analysis reads this file from the default branch.
sonar.sources=apps,packages,e2e,scripts,.github,eslint.config.js,vitest.config.ts
# Feature mocks under docs/ are review material, not product code (also if docs is ever added to sources).
sonar.exclusions=docs/features/**/mock/**
