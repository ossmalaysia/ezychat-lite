<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claims template preview</title>
    <style>
      :root {
        --background: #f8fafc;
        --foreground: #0f172a;
        --card: #fff;
        --primary: #0f766e;
        --primary-foreground: #fff;
        --muted-foreground: #475569;
        --accent: #f0fdfa;
        --border: #e2e8f0;
        --info: #0369a1;
        --info-bg: #e0f2fe;
        --success: #15803d;
        --note: #fffbeb;
        --note-border: #fcd34d;
        --note-foreground: #78350f;
        --overlay: rgb(0 0 0 / 0.5);
      }
      :root[data-theme='dark'] {
        --background: #0b1220;
        --foreground: #f1f5f9;
        --card: #111827;
        --primary: #14b8a6;
        --primary-foreground: #04201d;
        --muted-foreground: #94a3b8;
        --accent: #12302d;
        --border: #243042;
        --info: #7dd3fc;
        --info-bg: #0c2a3f;
        --success: #22c55e;
        --note: #2b2111;
        --note-border: #b45309;
        --note-foreground: #fde68a;
        --overlay: rgb(0 0 0 / 0.7);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        background: var(--background);
        color: var(--foreground);
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 8px 16px;
        border-bottom: 2px dashed var(--note-border);
        background: var(--note);
        color: var(--note-foreground);
      }
      .bar strong {
        margin-right: 8px;
      }
      .bar button,
      .bar select {
        min-height: 36px;
      }
      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      h1 {
        font-size: 22px;
        margin: 0;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .card h2 {
        font-size: 16px;
        margin: 0;
      }
      .muted {
        color: var(--muted-foreground);
      }
      .small {
        font-size: 12px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }
      button {
        font: inherit;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--foreground);
        padding: 6px 14px;
        min-height: 44px;
        cursor: pointer;
      }
      button.primary {
        background: var(--primary);
        color: var(--primary-foreground);
        border-color: var(--primary);
      }
      button[aria-pressed='true'] {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chips button {
        border-radius: 999px;
        min-height: 36px;
      }
      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      }
      .tpl {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 4px;
        background: var(--card);
      }
      .tpl[aria-checked='true'] {
        border-color: var(--primary);
        background: var(--accent);
      }
      .tpl b {
        font-weight: 600;
      }
      .banner {
        display: flex;
        gap: 10px;
        border: 1px solid var(--info);
        background: var(--info-bg);
        color: var(--foreground);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .banner p {
        margin: 0;
      }
      .banner p + p {
        margin-top: 4px;
      }
      label {
        font-weight: 600;
      }
      input,
      textarea {
        font: inherit;
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        background: var(--card);
        color: var(--foreground);
      }
      textarea {
        min-height: 220px;
        white-space: pre-wrap;
      }
      .types {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(3, 1fr);
      }
      .type {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
      }
      .type.on {
        border-color: var(--primary);
        background: var(--accent);
      }
      .switch {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .pill {
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 12px;
        border: 1px solid var(--border);
        white-space: nowrap;
        align-self: center;
      }
      .pill.on {
        background: var(--primary);
        color: var(--primary-foreground);
        border-color: var(--primary);
      }
      .toast {
        border: 1px solid var(--success);
        border-radius: 10px;
        padding: 10px 12px;
        background: var(--card);
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        font: inherit;
      }
      .overlay {
        position: fixed;
        inset: 0;
        background: var(--overlay);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .dialog {
        background: var(--card);
        border-radius: 12px;
        max-width: 900px;
        width: 100%;
        max-height: calc(100vh - 32px);
        overflow: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      @media (max-width: 640px) {
        .types {
          grid-template-columns: 1fr;
        }
        .overlay {
          padding: 0;
          align-items: flex-end;
        }
        .dialog {
          border-radius: 12px 12px 0 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="bar" role="region" aria-label="Mock only">
      <strong>Mock only</strong>
      <button data-screen="gallery">1 Gallery</button>
      <button data-screen="new">2 New agent, applied</button>
      <button data-screen="created">3 After Create agent</button>
      <button data-screen="existing">4 Existing agent (Lite)</button>
      <select id="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="ms">Bahasa Melayu</option>
        <option value="zh-CN">简体中文</option>
      </select>
      <button id="theme">Dark / Light</button>
    </div>
    <main id="app"></main>
    <script>
      /*TEXTS*/
      const ICON = { clinic: '🩺', insurance: '🛡️', tuition: '🎓', retail: '🏪', claims: '🧾' };
      const CATS = {
        clinic: 'health',
        insurance: 'services',
        tuition: 'education',
        retail: 'shops',
        claims: 'operations',
      };
      const PRESET = {
        clinic: 'faq',
        insurance: 'faq',
        tuition: 'sales',
        retail: 'sales',
        claims: 'custom',
      };
      const state = { screen: 'gallery', lang: 'en', cat: null, selected: 'claims' };
      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c],
        );
      const fill = (s, vars) => s.replace(/{{(\w+)}}/g, (_, k) => vars[k] ?? '');
      function gallery(T) {
        const cats = ['health', 'food', 'services', 'shops', 'education', 'operations'];
        const shown = Object.keys(T.templates).filter((id) => !state.cat || CATS[id] === state.cat);
        return `<div class="overlay"><div class="dialog" role="dialog" aria-label="${esc(T.bt.galleryTitle)}">
          <h2 style="margin:0">${esc(T.bt.galleryTitle)}</h2><p class="muted" style="margin:0">${esc(T.bt.galleryHint)}</p>
          <input type="search" placeholder="${esc(T.bt.searchPlaceholder)}" aria-label="${esc(T.bt.search)}" />
          <div class="chips" role="group">${[null, ...cats].map((c) => `<button data-cat="${c ?? ''}" aria-pressed="${state.cat === c}">${esc(c ? T.category[c] : T.category.all)}</button>`).join('')}</div>
          <div class="grid" role="radiogroup">${shown
            .map(
              (
                id,
              ) => `<div class="tpl" role="radio" tabindex="0" data-tpl="${id}" aria-checked="${state.selected === id}">
            <span>${ICON[id]} <b>${esc(T.templates[id].name)}</b></span>
            <span class="small muted">${esc(T.presets[PRESET[id]])}${id === 'claims' ? ' · ' + esc(T.bt.groupAgentTag) : ''}</span>
            <span class="muted">${esc(T.templates[id].description)}</span></div>`,
            )
            .join('')}</div>
          <div class="row" style="justify-content:flex-end"><button>${esc(T.ui.cancel)}</button><button class="primary" data-go="new" ${state.selected ? '' : 'disabled'}>${esc(T.bt.apply)}</button></div>
        </div></div>`;
      }
      function templateCard(T, mode) {
        return `<section class="card"><h2>${esc(T.bt.title)}</h2>
          <div class="row"><p class="muted" style="margin:0;flex:1 1 240px">${mode === 'created' ? esc(T.bt.applyHint) : esc(fill(T.bt.pendingItem, { item: T.templates.claims.contextName }))}</p><button class="primary">${esc(T.bt.browse)}</button></div>
          ${mode === 'created' ? '' : `<div class="banner" role="status"><span aria-hidden>ℹ️</span><div><p>${esc(mode === 'new' ? T.bt.groupSetupNew : T.bt.groupSetupExisting)}</p><p>${esc(T.bt.groupSetupNext)}</p></div></div>`}
        </section>`;
      }
      function editor(T, name, button) {
        const c = T.templates.claims;
        return `<section class="card"><label for="n">${esc(T.ui.name)}</label><input id="n" value="${esc(name)}" />
          <span>${esc(T.ui.pick)}</span><div class="types">${['sales', 'faq', 'custom'].map((p) => `<div class="type ${p === 'custom' ? 'on' : ''}"><b>${esc(T.presets[p])}</b><div class="small muted">${esc(T.presets[p + 'Description'])}</div></div>`).join('')}</div>
          <label for="r">${esc(T.ui.role)}</label><textarea id="r">${esc(c.focus)}</textarea>
          <label for="h">${esc(T.ui.handoff)}</label><textarea id="h" style="min-height:140px">${esc(c.handoffRules)}</textarea>
          <div class="row" style="justify-content:flex-end"><button class="primary" data-go="${button === T.ui.create ? 'created' : 'existing'}">${esc(button)}</button></div></section>`;
      }
      function created(T) {
        const c = T.templates.claims;
        return `<div class="toast" role="status">✅ ${esc(fill(T.bt.groupSetupDone, { name: c.agentName }))}</div>
          <h1>${esc(c.agentName)}</h1>
          ${templateCard(T, 'created')}
          <section class="card"><h2>${esc(T.ui.context)}</h2><div class="switch"><b>${esc(c.contextName)}</b><span class="pill">text</span></div><pre class="muted">${esc(c.contextText)}</pre></section>
          <section class="card"><h2>${esc(T.ui.direct)}</h2><div class="switch"><span>${esc(T.ui.directSwitch)}</span><span class="pill">Off</span></div></section>
          <section class="card"><h2>${esc(T.ui.groups)}</h2><div class="switch"><span>${esc(T.ui.groupsSwitch)}</span><span class="pill on">On</span></div></section>`;
      }
      function render() {
        const T = TEXTS[state.lang];
        document.documentElement.lang = state.lang;
        const app = document.getElementById('app');
        const c = T.templates.claims;
        if (state.screen === 'gallery')
          app.innerHTML = `<h1>${esc(c.agentName)}</h1>${templateCard(T, 'created')}${gallery(T)}`;
        if (state.screen === 'new')
          app.innerHTML = `<h1>${esc(c.agentName)}</h1>${templateCard(T, 'new')}${editor(T, c.agentName, T.ui.create)}`;
        if (state.screen === 'created') app.innerHTML = created(T);
        if (state.screen === 'existing')
          app.innerHTML = `<h1>Sales Assistant</h1>${templateCard(T, 'existing')}${editor(T, 'Sales Assistant', T.ui.save)}`;
      }
      document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-screen],[data-cat],[data-tpl],[data-go]');
        if (!el) return;
        if (el.dataset.screen) state.screen = el.dataset.screen;
        if (el.dataset.cat !== undefined) state.cat = el.dataset.cat || null;
        if (el.dataset.tpl) state.selected = el.dataset.tpl;
        if (el.dataset.go) state.screen = el.dataset.go;
        render();
      });
      document.getElementById('lang').addEventListener('change', (e) => {
        state.lang = e.target.value;
        render();
      });
      document.getElementById('theme').addEventListener('click', () => {
        const root = document.documentElement;
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      });
      const params = new URLSearchParams(location.search);
      if (params.get('screen')) state.screen = params.get('screen');
      if (params.get('lang')) state.lang = params.get('lang');
      if (params.get('cat')) state.cat = params.get('cat');
      if (params.get('theme')) document.documentElement.dataset.theme = params.get('theme');
      document.getElementById('lang').value = state.lang;
      render();
    </script>
  </body>
</html>
