name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Existing release tag to rebuild
        required: true
        type: string
      publish:
        description: Publish the draft as Latest when every build succeeded (set by release-approve.yml)
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  package:
    name: Package (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload installers to the draft release
      # GitHub OIDC for the Azure sign-in of Windows signing (no stored secret in this public repository).
      id-token: write
    # The Azure federated credential (github-ezychat-lite-release on the app ezychat-ci-signing) trusts
    # only this environment: subject repo:ossmalaysia@325334523/ezychat-lite@1400498086:environment:release
    # (the repository uses GitHub's immutable-ID subjects). Its rules allow v* tags and main.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            platform: win
            target: nsis
          - os: macos-15-intel
            arch: x64
            platform: mac
            target: dmg
          - os: macos-15
            arch: arm64
            platform: mac
            target: dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The updater shows the release body as the notes: take it from CHANGELOG.md, and stop here (before
      # the long build) when the version has no notes.
      - name: Release notes from CHANGELOG.md
        shell: bash
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: node scripts/release-notes.mjs "$TAG" > release-notes.md
      - run: node apps/desktop/scripts/fetch-cloudflared.mjs
      - run: node apps/desktop/scripts/fetch-winsw.mjs
        if: runner.os == 'Windows'
      - run: npm run build -w @ezychat/web
      # The server bundle carries the Google sign-in app (Google Calendar connector; a "Desktop app"
      # client of project ezychat-prod). Forks have no secrets: their builds show "Not available".
      - run: node scripts/bundle-server.mjs
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
          GOOGLE_PICKER_APP_ID: ${{ secrets.GOOGLE_PICKER_APP_ID }}
      - run: npm run build -w @ezychat/desktop
      # Windows signing with Azure Artifact Signing (Anchor Sprint Pte. Ltd.) when the repository
      # variables exist; without them the installer stays unsigned (forks, first setup).
      - name: Azure sign-in for Windows signing (GitHub OIDC)
        if: runner.os == 'Windows' && vars.AZURE_SIGN_ACCOUNT != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Prepare Windows signing tools
        if: runner.os == 'Windows' && vars.AZURE_SIGN_ACCOUNT != ''
        run: node scripts/azure-sign.mjs --github-env
        env:
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
          AZURE_SIGN_LOGIN: azure-cli
      # macOS: with the Developer ID secrets of the `release` environment (Anchor Sprint Pte. Ltd., team
      # 4N9HTT975Q; docs/release.md) the app is signed with the hardened runtime, notarized by Apple and
      # stapled, so it opens without "Open Anyway". Without them (forks, first setup) it stays ad-hoc
      # signed as in electron-builder.yml. CSC_LINK only on macOS: electron-builder would also try the
      # .p12 for Windows, which Azure Artifact Signing signs.
      - name: Package native architecture
        working-directory: apps/desktop
        shell: bash
        run: |
          args=()
          if [ "$RUNNER_OS" = macOS ] && [ -n "$CSC_LINK" ]; then
            umask 077
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/apple-api-key.p8"
            args=(-c.mac.identity="Anchor Sprint Pte. Ltd. (4N9HTT975Q)" -c.mac.hardenedRuntime=true -c.mac.notarize=true)
            echo "MAC_DEVELOPER_ID=1" >> "$GITHUB_ENV"
          fi
          npx electron-builder --config electron-builder.yml --${{ matrix.platform }} ${{ matrix.target }}:${{ matrix.arch }} --publish never "${args[@]}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_P8: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Verify the macOS app signature
        if: runner.os == 'macOS'
        # An unsealed bundle opens as "damaged" on Apple Silicon; never publish one. A Developer ID build
        # must also pass Gatekeeper (notarized) and carry its stapled ticket (opens offline).
        run: |
          shopt -s nullglob
          apps=(apps/desktop/release/mac*/*.app)
          [ ${#apps[@]} -gt 0 ] || { echo "::error::no packaged .app found"; exit 1; }
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            if [ "${MAC_DEVELOPER_ID:-}" = 1 ]; then
              codesign -dvv "$app" 2>&1 | grep -q 'Authority=Developer ID Application: Anchor Sprint Pte. Ltd. (4N9HTT975Q)'
              spctl --assess --type execute --verbose=2 "$app"
              xcrun stapler validate "$app"
            fi
          done
      - name: Verify the Windows installer signature
        if: runner.os == 'Windows' && vars.AZURE_SIGN_ACCOUNT != ''
        shell: pwsh
        # Never publish an installer that is unsigned or signed by anyone else.
        run: |
          $files = Get-ChildItem apps/desktop/release/*.exe, apps/desktop/release/win-unpacked/*.exe
          if (-not $files) { Write-Error 'no installer found'; exit 1 }
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            $cn = $s.SignerCertificate.Subject
            Write-Output "$($f.Name): $($s.Status) $cn"
            if ($s.Status -ne 'Valid' -or $cn -notlike "CN=$env:PUBLISHER,*") { exit 1 }
          }
        env:
          PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
      - name: Smoke packaged server with isolated test data
        run: node scripts/smoke-packaged.mjs
      # A copy of each signed installer without the version in its name, so
      # .../releases/latest/download/EzyChat-Lite-<os>-<arch>.<ext> always gives the newest one
      # (docs/release.md). The versioned file stays for the in-app updater.
      - name: Unversioned copies for permanent download links
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          for f in apps/desktop/release/EzyChat-Lite-"$version"-*-${{ matrix.arch }}.exe apps/desktop/release/EzyChat-Lite-"$version"-*-${{ matrix.arch }}.dmg; do
            [ -f "$f" ] || continue
            copy="${f/EzyChat-Lite-$version-/EzyChat-Lite-}"
            cp "$f" "$copy"
            echo "copied $(basename "$f") -> $(basename "$copy")"
          done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.ref || github.ref_name }}
          draft: true
          prerelease: true
          body_path: release-notes.md
          files: |
            apps/desktop/release/*-${{ matrix.arch }}.exe
            apps/desktop/release/*-${{ matrix.arch }}.dmg

  # Option A of the approved one-click release (docs/release.md §4): release-approve.yml starts this workflow on
  # the tag with publish=true after the owner's approval. Runs only when every package job succeeded; any
  # missing installer or notes leave the draft unpublished and fail the run.
  publish:
    name: Publish the release
    needs: package
    if: success() && github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == format('refs/tags/{0}', inputs.ref)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the draft (6 installers and the notes)
        run: |
          set -euo pipefail
          version="${TAG#v}"
          node scripts/release-publish.mjs version "$version"
          gh release view "$TAG" --repo "$REPO" --json isDraft,body,assets > release.json
          node scripts/release-publish.mjs draft "$version" release.json
      # One call: without --prerelease=false GitHub refuses Latest and installed apps ignore the release.
      - name: Publish as Latest
        run: gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease=false --latest
      - name: Check releases/latest
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$REPO/releases/latest" --jq .tag_name)"
          if [ "$latest" != "$TAG" ]; then
            echo "::error::releases/latest is $latest, not $TAG"
            exit 1
          fi
          echo "Published $TAG as Latest" >> "$GITHUB_STEP_SUMMARY"
