name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            platform: win
            target: nsis
          - os: macos-15-intel
            arch: x64
            platform: mac
            target: dmg
          - os: macos-15
            arch: arm64
            platform: mac
            target: dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-cloudflared.mjs
      - run: node scripts/fetch-winsw.mjs
        if: runner.os == 'Windows'
      - run: npm run build -w @wa-team-inbox/web
      - run: node scripts/bundle-server.mjs
      - run: npm run build -w @wa-team-inbox/desktop
      - name: Package native architecture
        working-directory: apps/desktop
        run: npx electron-builder --config electron-builder.yml --${{ matrix.platform }} ${{ matrix.target }}:${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke packaged server with isolated test data
        run: node scripts/smoke-packaged.mjs
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.ref || github.ref_name }}
          draft: true
          prerelease: true
          files: |
            apps/desktop/release/*-${{ matrix.arch }}.exe
            apps/desktop/release/*-${{ matrix.arch }}.dmg
