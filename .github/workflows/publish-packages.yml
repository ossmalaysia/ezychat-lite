name: Publish core packages

# Publishes the core as @ezychat/{shared,wa,server,web} to npm on each Lite release tag, at the
# same version as the app (EzyChat Enterprise pins these exact versions). Without the NPM_TOKEN
# secret (npm organisation not created yet) every publish runs with --dry-run.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: publish-packages-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @ezychat/*
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # No install scripts: publishing needs only tsc, Vite and Vitest, never native addons.
      - run: npm ci --ignore-scripts
      - name: Check the tag matches every package version
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
          node scripts/sync-version.mjs --check
      - run: npm run build:core
      - name: Package contract
        run: ./node_modules/.bin/vitest run scripts/pack-contract.test.mjs
      - name: Publish (dependencies first)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set: dry run only"
            mode="--dry-run"
          else
            mode="--provenance"
          fi
          for pkg in @ezychat/shared @ezychat/wa @ezychat/server @ezychat/web; do
            if [ -n "$NODE_AUTH_TOKEN" ] && npm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "$pkg@$version is already published; skipping"
              continue
            fi
            npm publish -w "$pkg" --access public --ignore-scripts $mode
          done
