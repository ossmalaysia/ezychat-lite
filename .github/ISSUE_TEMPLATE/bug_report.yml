name: Bug report
description: Report something that is not working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do **not** include phone numbers, message contents,
        session files, or other personal data. Security issues go through SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Other]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Run mode
      options: [Standalone, Service, Dev (npm run dev)]
  - type: dropdown
    id: access
    attributes:
      label: How was the web UI accessed?
      options: [Desktop window, LAN, Cloudflare quick tunnel, Cloudflare named tunnel]
  - type: input
    id: browser
    attributes:
      label: Browser / device
      placeholder: e.g. Safari on iPhone 14, Chrome 140 on Windows
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove personal data before pasting.
      render: shell
